<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Q1 Calculator</title><link rel="stylesheet" href="style.css"></head><body><main class="card">
<p><a href="index.html">← Assignment home</a></p><h1>Q1 — Simple Calculator</h1>
<form action="calculate" method="post">
  <p><label for="first">First number</label><input id="first" name="first" type="number" step="any"></p>
  <p><label for="second">Second number</label><input id="second" name="second" type="number" step="any"></p>
  <p><label for="operation">Operation</label><select id="operation" name="operation"><option value="add">Addition</option><option value="subtract">Subtraction</option><option value="multiply">Multiplication</option><option value="divide">Division</option></select></p>
  <button type="submit">Calculate</button>
</form></main></body></html>
